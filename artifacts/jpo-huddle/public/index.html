<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPO Huddle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0ece4; overflow: hidden; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    socket.on("connect", () => console.log("Connected to JPO Campus"));

    const WORLD_W = 2400;
    const WORLD_H = 1728;
    const GAP    = 48;

    const rooms = [
      { label: "👥 HR",         color: 0xb8e8e0, x: 48,   y: 48,   w: 576,  h: 624 },
      { label: "📣 Marketing",  color: 0xf5d9b0, x: 672,  y: 48,   w: 576,  h: 624 },
      { label: "🎯 Engagement", color: 0xfef3b0, x: 1296, y: 48,   w: 576,  h: 624 },
      { label: "⚙️ Operations", color: 0xe8e8e8, x: 1920, y: 48,   w: 432,  h: 624 },
      { label: null,            color: 0xf0ece4, x: 0,    y: 672,  w: 2400, h: 144 },
      { label: "💰 Accounting", color: 0xe8c8f0, x: 48,   y: 864,  w: 768,  h: 624 },
      { label: "☕ Canteen",    color: 0xfde8c0, x: 864,  y: 864,  w: 720,  h: 624 },
      { label: "📋 Meeting A",  color: 0xc8e0f8, x: 1632, y: 864,  w: 384,  h: 288 },
      { label: "📋 Meeting B",  color: 0xc8e0f8, x: 1632, y: 1200, w: 384,  h: 288 },
      { label: "🛋 Lounge",    color: 0xf8c8e0, x: 2064, y: 864,  w: 288,  h: 624 },
    ];

    const doorGaps = [
      { x: 288,  y: 672  },
      { x: 912,  y: 672  },
      { x: 1536, y: 672  },
      { x: 2112, y: 672  },
      { x: 384,  y: 864  },
      { x: 1152, y: 864  },
      { x: 1776, y: 864  },
      { x: 1776, y: 1200 },
      { x: 2112, y: 864  },
    ];

    class OfficeScene extends Phaser.Scene {
      constructor() { super("OfficeScene"); }

      preload() {
        this.load.image("interiors", "/assets/Interiors_free_16x16.png");
      }

      create() {
        // ── Phase 1: floor plan ──────────────────────────────────────

        const g = this.add.graphics();

        for (const room of rooms) {
          g.fillStyle(room.color, 1);
          g.fillRect(room.x, room.y, room.w, room.h);
        }

        g.lineStyle(2, 0x2a2a3a, 1);
        for (const room of rooms) {
          this.hWall(g, room.y,          room.x, room.x + room.w);
          this.hWall(g, room.y + room.h, room.x, room.x + room.w);
          this.vWall(g, room.x,          room.y, room.y + room.h);
          this.vWall(g, room.x + room.w, room.y, room.y + room.h);
        }

        for (const room of rooms) {
          if (!room.label) continue;
          this.add.text(room.x + 10, room.y + 10, room.label, {
            fontFamily: "monospace",
            fontSize: "13px",
            fontStyle: "bold",
            color: "#000000",
          }).setAlpha(0.33).setDepth(2);
        }

        // ── Phase 2: furniture frames ────────────────────────────────
        // Slice named frames from the interiors spritesheet.
        // Each tile is 16x16 source; sizes below are in source pixels.
        // At setScale(3) each source pixel becomes 3 world pixels.

        const tex = this.textures.get("interiors");
        //                  name          src  srcX  srcY   w    h
        tex.add("desk",       0,    0,    0,  48,  48);  // 3×3 tiles
        tex.add("plant",      0,  144,  512,  32,  48);  // 2×3 tiles
        tex.add("bookshelf",  0,    0,  256,  48,  32);  // 3×2 tiles
        tex.add("whiteboard", 0,  144,  576,  48,  32);  // 3×2 tiles
        tex.add("roundtable", 0,  128,  160,  48,  48);  // 3×3 tiles
        tex.add("longtable",  0,    0,  160,  64,  32);  // 4×2 tiles
        tex.add("counter",    0,    0,  320,  64,  32);  // 4×2 tiles
        tex.add("couch",      0,    0,  704,  64,  48);  // 4×3 tiles

        const f = (key, wx, wy) =>
          this.add.image(wx, wy, "interiors", key)
            .setOrigin(0, 0)
            .setScale(3)
            .setDepth(1);

        // HR
        f("desk",      96,  144);
        f("desk",      96,  288);
        f("desk",     336,  144);
        f("plant",    480,  144);
        f("bookshelf", 96,  480);

        // Marketing
        f("desk",      720, 144);
        f("desk",      720, 288);
        f("desk",      960, 144);
        f("whiteboard",1056,144);
        f("plant",    1152, 480);

        // Engagement
        f("desk",     1344, 144);
        f("desk",     1344, 288);
        f("desk",     1584, 144);
        f("plant",    1776, 144);
        f("plant",    1776, 480);

        // Operations
        f("desk",     1968, 144);
        f("desk",     1968, 288);
        f("desk",     2112, 144);
        f("bookshelf",1968, 480);

        // Accounting
        f("desk",       96,  960);
        f("desk",       96, 1104);
        f("desk",      336,  960);
        f("desk",      336, 1104);
        f("bookshelf", 672,  960);

        // Canteen
        f("roundtable",  912,  960);
        f("roundtable", 1104,  960);
        f("roundtable",  912, 1152);
        f("roundtable", 1104, 1152);
        f("counter",    1392,  960);
        f("plant",      1488, 1344);

        // Meeting A
        f("longtable",  1680,  912);
        f("whiteboard", 1680, 1056);

        // Meeting B
        f("longtable",  1680, 1248);
        f("whiteboard", 1680, 1392);

        // Lounge
        f("couch",      2112,  912);
        f("roundtable", 2208, 1056);
        f("plant",      2064, 1296);
        f("plant",      2256, 1296);

        // ── Camera ──────────────────────────────────────────────────
        const zoom = Math.min(
          this.scale.width  / WORLD_W,
          this.scale.height / WORLD_H
        );
        this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
        this.cameras.main.setZoom(zoom);
        this.cameras.main.centerOn(1200, 744);
      }

      hWall(g, wallY, x1, x2) {
        const gaps = doorGaps
          .filter(d => d.y === wallY && d.x >= x1 && d.x < x2)
          .map(d => d.x)
          .sort((a, b) => a - b);
        let cx = x1;
        g.beginPath();
        for (const gx of gaps) {
          if (gx > cx) { g.moveTo(cx, wallY); g.lineTo(gx, wallY); }
          cx = Math.max(cx, gx + GAP);
        }
        if (cx < x2) { g.moveTo(cx, wallY); g.lineTo(x2, wallY); }
        g.strokePath();
      }

      vWall(g, wallX, y1, y2) {
        g.beginPath();
        g.moveTo(wallX, y1);
        g.lineTo(wallX, y2);
        g.strokePath();
      }

      update() {}
    }

    const game = new Phaser.Game({
      type: Phaser.AUTO,
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: "#f0ece4",
      pixelArt: true,
      scene: OfficeScene,
    });
  </script>
</body>
</html>
