<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>JPO Huddle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f0ece4; overflow: hidden; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    socket.on("connect", () => console.log("Connected to JPO Campus"));

    const WORLD_W = 2400;   // 50 tiles * 16px * 3x
    const WORLD_H = 1728;   // 36 tiles * 16px * 3x
    const SPEED   = 150;

    class OfficeScene extends Phaser.Scene {
      constructor() { super("OfficeScene"); }

      preload() {
        this.load.image("roombuilder", "/assets/Room_Builder_free_16x16.png");
        this.load.image("interiors",   "/assets/Interiors_free_16x16.png");
        this.load.tilemapTiledJSON("map", "/assets/Office.tmj");
        this.load.spritesheet(
          'player',
          '/assets/Adam_16x16.png?nocache=' + Date.now(),
          { frameWidth: 16, frameHeight: 32 }
        );
      }

      create() {
        // ── Tilemap ──────────────────────────────────────────────────
        const map     = this.make.tilemap({ key: "map" });
        const tsRoom  = map.addTilesetImage("Room_Builder",         "roombuilder");
        const tsInter = map.addTilesetImage("Interiors_free_16x16", "interiors");
        const tilesets = [tsRoom, tsInter];

        const floorLayer = map.createLayer("Floor", tilesets);
        floorLayer.setScale(3);
        floorLayer.setPosition(0, 0);

        const wallLayer = map.createLayer("Wall", tilesets);
        wallLayer.setScale(3);
        wallLayer.setPosition(0, 0);

        const furnitureLayer = map.createLayer("Furniture", tilesets);
        furnitureLayer.setScale(3);
        furnitureLayer.setPosition(0, 0);

        // ── Animations ───────────────────────────────────────────────
        this.anims.create({
          key: 'idle',
          frames: this.anims.generateFrameNumbers('player', { start: 0, end: 0 }),
          frameRate: 1,
          repeat: -1
        });

        this.anims.create({
          key: 'walk_down',
          frames: this.anims.generateFrameNumbers('player', { start: 24, end: 31 }),
          frameRate: 8,
          repeat: -1
        });

        this.anims.create({
          key: 'walk_up',
          frames: this.anims.generateFrameNumbers('player', { start: 48, end: 55 }),
          frameRate: 8,
          repeat: -1
        });

        this.anims.create({
          key: 'walk_left',
          frames: this.anims.generateFrameNumbers('player', { start: 72, end: 79 }),
          frameRate: 8,
          repeat: -1
        });

        this.anims.create({
          key: 'walk_right',
          frames: this.anims.generateFrameNumbers('player', { start: 96, end: 103 }),
          frameRate: 8,
          repeat: -1
        });

        // ── Player ───────────────────────────────────────────────────
        this.player = this.physics.add.sprite(WORLD_W / 2, WORLD_H / 2, "player");
        this.player.setScale(3);
        this.player.setDepth(10);                 // always render above the map (no clipping by walls)
        this.player.setOrigin(0.5, 1);            // anchor at the feet
        // Feet-sized collision body so the character fits through 1-tile doorways.
        // Frame is 16×32; the body covers just the lower legs/feet (×3 scale → 36px, < 48px tile).
        this.player.body.setSize(12, 12);
        this.player.body.setOffset(2, 19);
        this.player.setCollideWorldBounds(true);
        this.player.play("idle");

        this.furnitureLayer = furnitureLayer;
        wallLayer.setCollisionByExclusion([-1]);
        this.physics.add.collider(this.player, wallLayer);

        // ── Input ────────────────────────────────────────────────────
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd    = this.input.keyboard.addKeys({
          up:    Phaser.Input.Keyboard.KeyCodes.W,
          down:  Phaser.Input.Keyboard.KeyCodes.S,
          left:  Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D,
        });
        this.keyE   = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);
        this.sitting = false;

        // ── Camera ───────────────────────────────────────────────────
        this.physics.world.setBounds(0, 0, WORLD_W, WORLD_H);
        this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
        this.cameras.main.setZoom(1);
        this.cameras.main.startFollow(this.player);

        // Mouse-wheel zoom: scroll up = zoom in, scroll down = zoom out
        this.input.on("wheel", (_ptr, _objs, _dx, dy) => {
          const cam  = this.cameras.main;
          const next = Phaser.Math.Clamp(cam.zoom + (dy < 0 ? 0.1 : -0.1), 0.5, 4);
          cam.setZoom(next);
        });
      }

      update() {
        const { cursors, wasd, player } = this;
        const up    = cursors.up.isDown    || wasd.up.isDown;
        const down  = cursors.down.isDown  || wasd.down.isDown;
        const left  = cursors.left.isDown  || wasd.left.isDown;
        const right = cursors.right.isDown || wasd.right.isDown;

        // ── Sit / stand on chairs (press E) ──────────────────────────
        if (Phaser.Input.Keyboard.JustDown(this.keyE)) {
          if (this.sitting) {
            this.sitting = false;
          } else {
            const tile = this.furnitureLayer.getTileAtWorldXY(player.x, player.y);
            if (tile) {
              // snap feet onto the chair tile (tiles are 48px in world space)
              player.setPosition(tile.x * 48 + 24, tile.y * 48 + 48);
              this.sitting = true;
            }
          }
        }
        if (this.sitting) {
          player.setVelocity(0, 0);
          if (player.anims.currentAnim?.key !== "idle") player.play("idle");
          return;
        }

        player.setVelocity(0, 0);

        if (left)       { player.setVelocityX(-SPEED); }
        else if (right) { player.setVelocityX( SPEED); }

        if (up)         { player.setVelocityY(-SPEED); }
        else if (down)  { player.setVelocityY( SPEED); }

        // Diagonal: normalise so speed is consistent
        if ((left || right) && (up || down)) {
          player.body.velocity.normalize().scale(SPEED);
        }

        // Animation — only switch when the direction actually changes
        const anim = player.anims.currentAnim?.key;
        if (left) {
          if (anim !== "walk_left")  player.play("walk_left");
        } else if (right) {
          if (anim !== "walk_right") player.play("walk_right");
        } else if (up) {
          if (anim !== "walk_up")    player.play("walk_up");
        } else if (down) {
          if (anim !== "walk_down")  player.play("walk_down");
        } else if (player.body.velocity.x === 0 && player.body.velocity.y === 0) {
          if (anim !== "idle")       player.play("idle");
        }
      }
    }

    const game = new Phaser.Game({
      type: Phaser.AUTO,
      width:  window.innerWidth,
      height: window.innerHeight,
      backgroundColor: "#f0ece4",
      pixelArt: true,
      physics: { default: "arcade", arcade: { debug: false } },
      scene: OfficeScene,
    });
  </script>
</body>
</html>
