kind = "web"
previewPath = "/"
title = "JPO Huddle"
version = "1.0.0"
id = "artifacts/jpo-huddle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20158

[services.development]
run = "pnpm --filter @workspace/jpo-huddle run dev"

[services.production]

[services.production.run]
args = ["node", "artifacts/jpo-huddle/server.js"]

[services.production.run.env]
PORT = "20158"
NODE_ENV = "production"

[services.env]
PORT = "20158"
